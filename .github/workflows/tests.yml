name: Python tests and notebooks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,notebooks]'
      - run: python -m pytest -q
      - name: Execute notebooks from a clean checkout
        if: matrix.python == '3.12'
        run: python scripts/execute_notebooks.py
